# DevUnity CodeArena — Render Blueprint
# Deploy: push this repo to GitHub → New Blueprint in Render → select the repo.
services:
  - type: web
    name: codearena
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm --prefix server install --omit=dev && npm --prefix web install && npm --prefix web run build
    startCommand: NODE_ENV=production node server/src/index.js
    healthCheckPath: /api/system/status
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: AUTOSEED
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: codearena-db
          property: connectionString
    autoDeployTrigger: commit
databases:
  - name: codearena-db
    databaseName: codearena
    plan: free
    postgresMajorVersion: "17"
